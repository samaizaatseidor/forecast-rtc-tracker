  function periodSummary(deals, periodKeyFn, periodVal){
    const open = deals.filter(d=>d.resultado==='Abierta' && periodKeyFn(d.fecha)===periodVal);
    const commit = open.filter(d=>d.fcat==='Commit').reduce((s,d)=>s+Number(d.monto||0),0);
    const probable = open.filter(d=>d.fcat==='Probable').reduce((s,d)=>s+Number(d.monto||0),0);
    const topUpside = open.filter(d=>d.fcat==='Top Upside').reduce((s,d)=>s+Number(d.monto||0),0);
    const upside = open.filter(d=>d.fcat==='Upside').reduce((s,d)=>s+Number(d.monto||0),0);
    const ganado = deals.filter(d=>d.resultado==='Ganada' && periodKeyFn(d.fecha)===periodVal).reduce((s,d)=>s+Number(d.monto||0),0);
    return { commit, probable, topUpside, upside, ganado, total: commit+probable };
  }

      cuotaAnual = reps.reduce((s,r)=>s+getCuotaAnual(r),0);
    }
    const pctMes = cuotaMes ? (sMes.commit+sMes.probable+sMes.ganado)/cuotaMes : null;
    const pctTrim = cuotaTrim ? (sTrim.commit+sTrim.probable+sTrim.ganado)/cuotaTrim : null;
    const pctAnual = cuotaAnual ? sYear.ganado/cuotaAnual : null;
    const cMes = statusColor(pctMes), cTrim = statusColor(pctTrim), cAnual = statusColor(pctAnual);

    html += `<div class="ft-section-title" style="margin-top:0"><span class="bar"></span>Resumen del año en curso (${yKey})</div>`;
    html += `<div class="ft-grid">
      <div class="ft-card"><div class="label">Ganado en el año (YTD)</div><div class="value">${money(sYear.ganado)}</div></div>
      <div class="ft-card"><div class="label">Commit + Probable abierto (año)</div><div class="value">${money(sYear.commit+sYear.probable)}</div></div>
      <div class="ft-card"><div class="label">Cuota anual</div><div class="value">${money(cuotaAnual)}</div></div>
      <div class="ft-card">
        <div class="label">% Cuota anual cubierto (solo ganado)</div>
        <div class="value" style="color:${cAnual.fg}">${pct(pctAnual)}</div>
        <div class="ft-progress"><div class="ft-progress-fill" style="width:${Math.min(100,(pctAnual||0)*100)}%; background:${cAnual.fg}"></div></div>
      </div>

    html += `<div class="ft-section-title"><span class="bar"></span>Resumen del mes en curso (${monthLabel()})</div>`;
    html += `<div class="ft-grid">
      <div class="ft-card"><div class="label">Commit (Worst Case)</div><div class="value">${money(sMes.commit)}</div></div>
      <div class="ft-card"><div class="label">Probable (Best Case)</div><div class="value">${money(sMes.probable)}</div></div>
      <div class="ft-card"><div class="label">Ya ganado</div><div class="value">${money(sMes.ganado)}</div></div>
      <div class="ft-card"><div class="label">Cuota (estimada, cuota Q ÷ 3)</div><div class="value">${money(cuotaMes)}</div></div>
      <div class="ft-card">
        <div class="label">% Cuota cubierto</div>
        <div class="value" style="color:${cMes.fg}">${pct(pctMes)}</div>
        <div class="ft-progress"><div class="ft-progress-fill" style="width:${Math.min(100,(pctMes||0)*100)}%; background:${cMes.fg}"></div></div>

    html += `<div class="ft-section-title"><span class="bar"></span>Resumen del trimestre en curso (${qKey})</div>`;
    html += `<div class="ft-grid">
      <div class="ft-card"><div class="label">Commit (Worst Case)</div><div class="value">${money(sTrim.commit)}</div></div>
      <div class="ft-card"><div class="label">Probable (Best Case)</div><div class="value">${money(sTrim.probable)}</div></div>
      <div class="ft-card"><div class="label">Ya ganado</div><div class="value">${money(sTrim.ganado)}</div></div>
      <div class="ft-card"><div class="label">Cuota ${qKey}</div><div class="value">${money(cuotaTrim)}</div></div>
      <div class="ft-card">
        <div class="label">% Cuota cubierto</div>
        <div class="value" style="color:${cTrim.fg}">${pct(pctTrim)}</div>
        <div class="ft-progress"><div class="ft-progress-fill" style="width:${Math.min(100,(pctTrim||0)*100)}%; background:${cTrim.fg}"></div></div>

    html += `<div class="ft-section-title"><span class="bar"></span>Resumen del próximo trimestre — Q+1 (${nqKey})</div>`;
    html += `<div class="ft-grid">
      <div class="ft-card"><div class="label">Commit (Worst Case)</div><div class="value">${money(sNextTrim.commit)}</div></div>
      <div class="ft-card"><div class="label">Probable (Best Case)</div><div class="value">${money(sNextTrim.probable)}</div></div>
      <div class="ft-card"><div class="label">Total esperado</div><div class="value">${money(sNextTrim.total)}</div></div>
      <div class="ft-card"><div class="label">Cuota ${nqKey}</div><div class="value">${money(cuotaNextTrim)}</div></div>
    </div>`;

    if(!scopeRep){
      html += `<div class="ft-section-title"><span class="bar"></span>Detalle por rep (mes actual)</div>`;
      html += `<div class="ft-table-wrap"><table class="ft-table"><thead><tr>
        <th>Rep</th><th>Cuota mensual</th><th>Commit (Worst Case)</th><th>Probable (Best Case)</th>
        <th>Upside total</th><th>Total esperado</th><th>% Cuota</th><th>Coverage</th>
        <th>Ganadas (#)</th><th>Estancadas</th><th>Activ. vencidas</th>
      </tr></thead><tbody>`;
      reps.forEach(rep=>{
        const rMes = periodSummary(filterDealsByRep(rep), monthKey, mKey);
        const all = repAllTimeStats(rep);
        const p = all.cuotaMensual ? (rMes.commit+rMes.probable+rMes.ganado)/all.cuotaMensual : null;
        const cov = all.cuotaMensual ? all.upsideAll/all.cuotaMensual : null;
        const c = statusColor(p);
        html += `<tr>
          <td><strong>${rep}</strong></td>
          <td>${money(all.cuotaMensual)}</td>
          <td>${money(rMes.commit)}</td>
          <td>${money(rMes.probable)}</td>
          <td>${money(all.upsideAll)}</td>
          <td>${money(rMes.commit+rMes.probable)}</td>
          <td><span class="badge" style="background:${c.bg}; color:${c.fg}">${pct(p)}</span></td>
          <td>${cov===null?'n/a':cov.toFixed(1)+'x'}</td>
          <td>${all.ganadas}</td>
          <td>${all.stalled>0 ? `<span class="badge badge-stalled">${all.stalled} ⚠️</span>` : '0'}</td>
          <td>${all.overdue>0 ? `<span class="badge badge-overdue">${all.overdue} ⏰</span>` : '0'}</td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
    } else {
      const all = repAllTimeStats(scopeRep);
      const p = all.cuotaMensual ? (sMes.commit+sMes.probable+sMes.ganado)/all.cuotaMensual : null;
      const cov = all.cuotaMensual ? all.upsideAll/all.cuotaMensual : null;
      html += `<div class="ft-section-title"><span class="bar"></span>KPIs de ${scopeRep}</div>`;
      html += `<div class="ft-grid">
        <div class="ft-card"><div class="label">Upside total (Top Upside + Upside)</div><div class="value">${money(all.upsideAll)}</div></div>
        <div class="ft-card"><div class="label">Coverage (Upside / Cuota mensual)</div><div class="value">${cov===null?'n/a':cov.toFixed(1)+'x'}</div></div>
        <div class="ft-card"><div class="label">Oportunidades ganadas (total)</div><div class="value">${all.ganadas}</div></div>
        <div class="ft-card"><div class="label">Estancadas</div><div class="value" style="color:${all.stalled>0?'var(--red)':'inherit'}">${all.stalled}</div></div>
        <div class="ft-card"><div class="label">Actividades vencidas</div><div class="value" style="color:${all.overdue>0?'var(--orange)':'inherit'}">${all.overdue}</div></div>
      </div>`;
    }

    html += `<div class="ft-section-title"><span class="bar"></span>Cierres por tipo de oportunidad ${scopeRep?'— '+scopeRep:'— equipo'}</div>`;
    const tb = tipoBreakdown(scopeDeals);
    html += `<div class="ft-table-wrap"><table class="ft-table"><thead><tr><th>Tipo</th><th># Cerradas</th><th>Monto total</th></tr></thead><tbody>`;
    Object.keys(tb).forEach(tipo=>{
      if(tb[tipo].count===0) return;
      html += `<tr><td>${tipo==='Sin tipo'?'<span class="ft-note">Sin tipo</span>':tipoBadge(tipo)}</td><td>${tb[tipo].count}</td><td>${money(tb[tipo].monto)}</td></tr>`;
    });
    if(Object.values(tb).every(v=>v.count===0)){
      html += `<tr><td colspan="3" class="ft-empty">Aún no hay oportunidades ganadas en este alcance.</td></tr>`;
    }
    html += `</tbody></table></div>`;

    const stalledDeals = scopeDeals.filter(d=>d.resultado==='Abierta' && daysSince(lastActivityDate(d))!==null && daysSince(lastActivityDate(d))>STALL_DAYS)
      .sort((a,b)=>daysSince(lastActivityDate(b))-daysSince(lastActivityDate(a)));
    html += `<div class="ft-section-title"><span class="bar"></span>Oportunidades estancadas (&gt;${STALL_DAYS} d&iacute;as sin actividad)</div>`;
    if(stalledDeals.length===0){
      html += `<div class="ft-empty">Ninguna oportunidad abierta lleva más de ${STALL_DAYS} días sin actividad. 👍</div>`;
    } else {
      html += `<div class="ft-table-wrap"><table class="ft-table"><thead><tr>
        <th>Rep</th><th>Cliente</th><th>Oportunidad</th><th>D&iacute;as sin actividad</th><th>Pr&oacute;ximo paso (RTC)</th>
      </tr></thead><tbody>`;
      stalledDeals.forEach(d=>{
        html += `<tr>
          <td>${d.rep}</td><td>${d.cliente||'—'}</td><td>${d.oportunidad}</td>
          <td><span class="badge badge-stalled">${daysSince(lastActivityDate(d))} d&iacute;as</span></td>
          <td>${d.rtc||'<em>sin definir</em>'}</td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
    }

    const overdueDeals = scopeDeals.filter(d=>d.resultado==='Abierta' && hasOverduePendingActivity(d));
    html += `<div class="ft-section-title"><span class="bar"></span>Actividades pendientes vencidas (no marcadas como completadas)</div>`;
    if(overdueDeals.length===0){
      html += `<div class="ft-empty">No hay actividades pendientes vencidas. 👍</div>`;
    } else {
      html += `<div class="ft-table-wrap"><table class="ft-table"><thead><tr>
        <th>Rep</th><th>Oportunidad</th><th>Actividades vencidas</th><th>Detalle</th>
      </tr></thead><tbody>`;
      overdueDeals.forEach(d=>{
        const t = todayISO();
        const pend = (d.actividades||[]).filter(a=>!a.completada && a.fecha && a.fecha<=t);
        html += `<tr>
          <td>${d.rep}</td><td>${d.oportunidad}</td>
          <td><span class="badge badge-overdue">${pend.length} ⏰</span></td>
          <td>${pend.map(a=>`${a.descripcion||'(sin descripción)'} — ${a.fecha}`).join('<br>')}</td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
    }

    body.innerHTML = html;

    document.getElementById('ft-scope-select').addEventListener('change', (e)=>{
      state.dashboardScope = e.target.value;
      renderDashboard();
    });
  }

  function renderActivitiesUI(){
    const container = document.getElementById('ft-activities-list');
    if(!container) return;
    if(state.formActivities.length===0){
      container.innerHTML = `<div class="ft-note" style="margin-bottom:8px;">Sin actividades registradas todavía.</div>`;
    } else {
      container.innerHTML = state.formActivities.map((a,i)=>`
        <div class="ft-activity-row" data-idx="${i}">
          <input type="text" class="ft-act-desc" placeholder="Descripción de la actividad" value="${(a.descripcion||'').replace(/"/g,'&quot;')}">
          <input type="date" class="ft-act-fecha" value="${a.fecha||''}">
          <label class="ft-act-done"><input type="checkbox" class="ft-act-check" ${a.completada?'checked':''}> Completada</label>
          <button type="button" class="ft-btn danger tiny ft-act-remove" title="Quitar">✕</button>
        </div>
      `).join('');
      container.querySelectorAll('.ft-activity-row').forEach(row=>{
        const idx = Number(row.dataset.idx);
        row.querySelector('.ft-act-desc').addEventListener('input', (e)=>{ state.formActivities[idx].descripcion = e.target.value; });
        row.querySelector('.ft-act-fecha').addEventListener('change', (e)=>{ state.formActivities[idx].fecha = e.target.value; });
        row.querySelector('.ft-act-check').addEventListener('change', (e)=>{ state.formActivities[idx].completada = e.target.checked; });
        row.querySelector('.ft-act-remove').addEventListener('click', ()=>{ state.formActivities.splice(idx,1); renderActivitiesUI(); });
      });
    }
  }

  function refreshFcatOptions(){
    const etapaSel = document.getElementById('ft-etapa-select');
    const fcatSel = document.getElementById('ft-fcat-select');
    if(!etapaSel || !fcatSel) return;
    const allowed = computeAllowedFcats(etapaSel.value);
    const prev = fcatSel.value;
    fcatSel.innerHTML = allowed.map(f=>`<option value="${f}" ${f===prev?'selected':''}>${f}</option>`).join('');
    if(!allowed.includes(prev)){
      fcatSel.value = allowed[0];
    }
    fcatSel.disabled = allowed.length===1;
  }
  function refreshResultadoField(){
    const etapaSel = document.getElementById('ft-etapa-select');
    const resSel = document.getElementById('ft-resultado-select');
    if(!etapaSel || !resSel) return;
    const forced = computeForcedResultado(etapaSel.value);
    if(forced){
      resSel.value = forced;
      resSel.disabled = true;
    } else {
      resSel.disabled = false;
    }
  }
  function refreshEtapaDependentFields(){
    refreshFcatOptions();
    refreshResultadoField();
  }

  function renderOportunidades(){
    const editing = state.editingId ? state.deals.find(d=>d.id===state.editingId) : null;
    const reps = state.config.reps;
    if(!state.editingId && state.formActivities===undefined) state.formActivities = [];
    if(editing && state.formActivities.__loadedFor !== editing.id){
      state.formActivities = JSON.parse(JSON.stringify(editing.actividades || []));
      state.formActivities.__loadedFor = editing.id;
    }
    if(!editing && state.formActivities.__loadedFor !== 'new'){
      state.formActivities = [];
      state.formActivities.__loadedFor = 'new';
    }

    let html = '';
    html += `<div class="ft-form-box">
      <div class="ft-section-title" style="margin-top:0"><span class="bar"></span>${editing?'Editar oportunidad':'Nueva oportunidad'}</div>

          <div class="ft-field"><label>Rep</label>
            <select name="rep" required>${reps.map(r=>`<option value="${r}" ${editing&&editing.rep===r?'selected':''}>${r}</option>`).join('')}</select>

          </div>
          <div class="ft-field"><label>Forecast Category</label>
            <select name="fcat" id="ft-fcat-select">${(function(){
              const initEtapa = editing ? editing.etapa : GSG_STAGES[0];
              const allowed = computeAllowedFcats(initEtapa);
              const initVal = editing && allowed.includes(editing.fcat) ? editing.fcat : allowed[0];
              return allowed.map(f=>`<option value="${f}" ${f===initVal?'selected':''}>${f}</option>`).join('');
            })()}</select>
          </div>
          <div class="ft-field"><label>Tipo de oportunidad</label>

          <div class="ft-field"><label>Fecha cierre estimada</label><input type="date" name="fecha" required value="${editing?editing.fecha:''}"></div>
          <div class="ft-field"><label>Fecha pr&oacute;ximo paso</label><input type="date" name="fechaProximoPaso" value="${editing?(editing.fechaProximoPaso||''):''}"></div>
          <div class="ft-field"><label>Resultado</label>
            <select name="resultado" id="ft-resultado-select">${RESULTS.map(s=>`<option ${editing&&editing.resultado===s?'selected':''}>${s}</option>`).join('')}</select>
          </div>
        </div>
        <div class="ft-field" style="margin-bottom:12px;"><label>RTC &mdash; Pr&oacute;ximo paso</label><textarea name="rtc">${editing?editing.rtc||'':''}</textarea></div>

        <div class="ft-field" style="margin-bottom:14px;">
          <label>Actividades</label>
          <div id="ft-activities-list"></div>

        <div class="ft-field" style="margin-bottom:12px;">
          <label>MEDDPICC m&iacute;nimo</label>

            <div class="ft-toggle ${editing&&editing.eb?'on':''}" data-field="eb">Economic Buyer confirmado</div>
            <div class="ft-toggle ${editing&&editing.champion?'on':''}" data-field="champion">Champion confirmado</div>

        ${editing?'<button type="button" class="ft-btn secondary" id="ft-cancel-edit" style="margin-left:8px;">Cancelar</button>':''}
      </form>
    </div>`;

    html += `<div class="ft-filter-row">
      <select id="ft-filter-rep"><option value="">Todos los reps</option>${reps.map(r=>`<option>${r}</option>`).join('')}</select>
      <select id="ft-filter-result"><option value="">Todos los resultados</option>${RESULTS.map(r=>`<option>${r}</option>`).join('')}</select>
      <span class="ft-note">${state.deals.length} oportunidad(es) registradas</span>
    </div>`;

    html += `<div class="ft-table-wrap"><table class="ft-table" id="ft-deals-table"><thead><tr>

    ${state.deals.length===0 ? `<tr><td colspan="11" class="ft-empty">Sin oportunidades registradas todav&iacute;a. Agrega la primera arriba.</td></tr>` :
      state.deals.map(d=>{

        return `<tr data-rep="${d.rep}" data-result="${d.resultado}">

    document.getElementById('ft-deal-form').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);

        .filter(a=>a && (a.descripcion || a.fecha))
        .map(a=>({descripcion:a.descripcion||'', fecha:a.fecha||'', completada: !!a.completada}));
      const deal = {
        id: editing ? editing.id : uid(),
        rep: fd.get('rep'), cliente: fd.get('cliente'), oportunidad: fd.get('oportunidad'),
        etapa: fd.get('etapa'), fcat: document.getElementById('ft-fcat-select').value, tipo: fd.get('tipo'), monto: Number(fd.get('monto')||0),
        fecha: fd.get('fecha'), fechaProximoPaso: fd.get('fechaProximoPaso'),
        resultado: document.getElementById('ft-resultado-select').value,

      render();

    document.querySelectorAll('[data-field]').forEach(t=>{

          render();

      const repVal = document.getElementById('ft-filter-rep').value;
      const resVal = document.getElementById('ft-filter-result').value;
      document.querySelectorAll('#ft-deals-table tbody tr[data-rep]').forEach(tr=>{
        const okRep = !repVal || tr.dataset.rep===repVal;
        const okRes = !resVal || tr.dataset.result===resVal;
        tr.style.display = (okRep && okRes) ? '' : 'none';
      });
    }
    document.getElementById('ft-filter-rep').addEventListener('change', applyFilters);
    document.getElementById('ft-filter-result').addEventListener('change', applyFilters);
  }

  function renderCuotas(){
    const reps = state.config.reps;
    let html = `<div class="ft-section-title" style="margin-top:0"><span class="bar"></span>Reps y cuotas (USD)</div>`;
    html += `<div class="ft-note" style="margin-bottom:10px;">Captura la cuota anual y la cuota de cada trimestre por separado — no tienen que ser iguales entre sí (útil si hay estacionalidad). El botón "÷4" reparte la cuota anual en partes iguales entre los 4 trimestres, como punto de partida.</div>`;
    html += `<div class="ft-table-wrap"><table class="ft-table"><thead><tr>
      <th>Rep</th><th>Cuota anual</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th></th>
    </tr></thead><tbody>`;
    reps.forEach((rep, i)=>{
      const q = state.config.quotas[rep] || {};
      const inputStyle = "border:1px solid var(--grey-line); border-radius:6px; padding:6px 8px; font-size:12.5px; width:110px;";
      html += `<tr>
        <td><input class="ft-rep-name" data-idx="${i}" value="${rep}" style="border:1px solid var(--grey-line); border-radius:6px; padding:6px 8px; font-size:12.5px; width:150px;"></td>
        <td><input type="number" class="ft-quota-anual" data-rep="${rep}" value="${q.anual||0}" min="0" step="1000" style="${inputStyle} width:130px;"></td>
        <td><input type="number" class="ft-quota-q1" data-rep="${rep}" value="${q.q1||0}" min="0" step="500" style="${inputStyle}"></td>
        <td><input type="number" class="ft-quota-q2" data-rep="${rep}" value="${q.q2||0}" min="0" step="500" style="${inputStyle}"></td>
        <td><input type="number" class="ft-quota-q3" data-rep="${rep}" value="${q.q3||0}" min="0" step="500" style="${inputStyle}"></td>
        <td><input type="number" class="ft-quota-q4" data-rep="${rep}" value="${q.q4||0}" min="0" step="500" style="${inputStyle}"></td>
        <td style="white-space:nowrap;">
          <button class="ft-btn secondary tiny" data-split-rep="${rep}" title="Repartir cuota anual entre Q1-Q4 en partes iguales">÷4</button>
          <button class="ft-btn danger" data-remove-rep="${rep}">Quitar</button>
        </td>
      </tr>`;
    });
    const totAnual = reps.reduce((s,r)=>s+Number((state.config.quotas[r]||{}).anual||0),0);
    const totQ1 = reps.reduce((s,r)=>s+Number((state.config.quotas[r]||{}).q1||0),0);
    const totQ2 = reps.reduce((s,r)=>s+Number((state.config.quotas[r]||{}).q2||0),0);
    const totQ3 = reps.reduce((s,r)=>s+Number((state.config.quotas[r]||{}).q3||0),0);
    const totQ4 = reps.reduce((s,r)=>s+Number((state.config.quotas[r]||{}).q4||0),0);
    html += `<tr style="background:var(--grey-bg); font-weight:600;"><td>Total equipo</td><td>${money(totAnual)}</td><td>${money(totQ1)}</td><td>${money(totQ2)}</td><td>${money(totQ3)}</td><td>${money(totQ4)}</td><td></td></tr>`;
    html += `</tbody></table></div>`;
    html += `<div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
      <button class="ft-btn secondary" id="ft-add-rep">+ Agregar rep</button>
      <button class="ft-btn" id="ft-save-cuotas">Guardar cambios</button>
      <button class="ft-btn secondary" id="ft-seed-data" style="border-color:var(--amber); color:var(--amber);">🔄 Cargar datos de ejemplo (SEIDOR)</button>
    </div>`;
    html += `<div class="ft-note">Los nombres de rep deben coincidir exactamente con los que uses en "Oportunidades" para que el Dashboard sume correctamente.</div>`;
    html += `<div class="ft-note">"Cargar datos de ejemplo" reemplaza reps y oportunidades actuales por las 53 oportunidades ya ganadas cargadas desde tu export de HubSpot (Fernanda Richards, Natalia Ossa, Estefanía Muñoz, Manuel Apón). Úsalo solo si quieres reiniciar con esos datos — es una acción destructiva.</div>`;

    body.innerHTML = html;

    document.querySelectorAll('[data-split-rep]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const rep = btn.dataset.splitRep;
        const row = btn.closest('tr');
        const anualInput = document.querySelector(`.ft-quota-anual[data-rep="${rep}"]`);
        const parte = Math.round(Number(anualInput.value||0) / 4);
        document.querySelector(`.ft-quota-q1[data-rep="${rep}"]`).value = parte;
        document.querySelector(`.ft-quota-q2[data-rep="${rep}"]`).value = parte;
        document.querySelector(`.ft-quota-q3[data-rep="${rep}"]`).value = parte;
        document.querySelector(`.ft-quota-q4[data-rep="${rep}"]`).value = parte;
      });
    });

    document.getElementById('ft-add-rep').addEventListener('click', async ()=>{
      let n = 1;
      let name = 'Nuevo Rep';
      while(state.config.reps.includes(name)){ n++; name = 'Nuevo Rep ' + n; }
      state.config.reps.push(name);
      state.config.quotas[name] = {anual:0, q1:0, q2:0, q3:0, q4:0};
      await saveConfig();
      render();
    });

    document.querySelectorAll('[data-remove-rep]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const rep = btn.dataset.removeRep;
        const hasDeals = state.deals.some(d=>d.rep===rep);
        if(hasDeals && !confirm(`${rep} tiene oportunidades registradas. ¿Quitarlo de la lista de reps de todos modos? Sus oportunidades no se borrarán pero dejarán de sumar en el Dashboard.`)) return;
        state.config.reps = state.config.reps.filter(r=>r!==rep);
        delete state.config.quotas[rep];
        await saveConfig();
        render();
      });
    });

    document.getElementById('ft-save-cuotas').addEventListener('click', async ()=>{
      const newReps = [];
      document.querySelectorAll('.ft-rep-name').forEach(input=>{
        newReps.push(input.value.trim() || ('Rep ' + (Number(input.dataset.idx)+1)));
      });
      const oldReps = state.config.reps;
      const newQuotas = {};
      const fields = [['ft-quota-anual','anual'],['ft-quota-q1','q1'],['ft-quota-q2','q2'],['ft-quota-q3','q3'],['ft-quota-q4','q4']];
      fields.forEach(([cls, key])=>{
        document.querySelectorAll('.'+cls).forEach((input, i)=>{
          const rep = newReps[i];
          newQuotas[rep] = newQuotas[rep] || {};
          newQuotas[rep][key] = Number(input.value||0);
        });
      });
      oldReps.forEach((oldRep, i)=>{
        const newRep = newReps[i];
        if(newRep && newRep !== oldRep){
          state.deals.forEach(d=>{ if(d.rep===oldRep) d.rep = newRep; });
        }
      });
      state.config.reps = newReps;
      state.config.quotas = newQuotas;
      await saveConfig();
      await saveDeals();
      render();
    });

    document.getElementById('ft-seed-data').addEventListener('click', async ()=>{
      if(!confirm('Esto va a REEMPLAZAR los reps y todas las oportunidades actuales por los datos de ejemplo de SEIDOR (53 oportunidades ganadas). ¿Continuar?')) return;
      state.config = { reps: SEED_DATA.reps.slice(), quotas: {} };
      state.deals = JSON.parse(JSON.stringify(SEED_DATA.deals));
      await saveConfig();
      await saveDeals();
      state.dashboardScope = '__team__';
      state.activeTab = 'dashboard';
      document.querySelectorAll('.ft-tab').forEach(t=>t.classList.toggle('active', t.dataset.tab==='dashboard'));
      render();
    });
  }

  function renderAyuda(){
    body.innerHTML = `
      <div class="ft-section-title" style="margin-top:0"><span class="bar"></span>¿Para qué sirve esto?</div>
      <p style="font-size:13px; line-height:1.6; color:var(--navy);">Mientras HubSpot no tenga forecast categories, campos obligatorios ni criterios de salida por etapa,
      este tablero es la fuente de verdad temporal del forecast del equipo. Cada rep captura sus oportunidades abiertas
      en la pestaña <strong>Oportunidades</strong>. El <strong>Dashboard</strong> se recalcula solo.</p>

      <div class="ft-section-title"><span class="bar"></span>Definiciones de Forecast Category</div>
      <p style="font-size:13px; line-height:1.7;">
      ${fcatBadge('Commit')} certeza alta — equivale al "worst case": lo mínimo que se va a cerrar.<br>
      ${fcatBadge('Probable')} probable — equivale al "best case": razonablemente esperado pero con algo de riesgo.<br>
      ${fcatBadge('Top Upside')} con potencial fuerte, pero aún no asegurado.<br>
      ${fcatBadge('Upside')} en desarrollo, upside especulativo.
      </p>

      <div class="ft-section-title"><span class="bar"></span>Reglas de etapa → forecast category</div>
      <p style="font-size:13px; line-height:1.7;">
      • Si la etapa es <strong>B - Contracting</strong>, el forecast category se fuerza automáticamente a <strong>Commit</strong>.<br>
      • Si la etapa es <strong>C - Negotiation</strong>, solo se puede elegir <strong>Commit</strong> o <strong>Probable</strong>.<br>
      • En cualquier otra etapa, las 4 categorías están disponibles.
      </p>

      <div class="ft-section-title"><span class="bar"></span>¿Qué es "Estancado" y "Actividad vencida"?</div>
      <p style="font-size:13px; line-height:1.6;">Una oportunidad abierta se marca ${`<span class="badge badge-stalled">⚠️ Estancado</span>`} si pasaron más de
      ${STALL_DAYS} días desde su última actividad registrada. Además, si registras una actividad con fecha y no la marcas
      "Completada", y esa fecha ya pasó, se marca ${`<span class="badge badge-overdue">⏰ vencida</span>`} — ambas alertas aparecen en el Dashboard.</p>

      <div class="ft-section-title"><span class="bar"></span>Vista de equipo vs. por vendedor</div>
      <p style="font-size:13px; line-height:1.6;">El selector "Ver:" arriba del Dashboard cambia todo el tablero entre la vista consolidada del equipo
      y los KPIs individuales de cada rep (cuota, forecast, upside, cierres, estancados, actividades vencidas).</p>

      <div class="ft-section-title"><span class="bar"></span>Dónde viven los datos</div>
      <p style="font-size:13px; line-height:1.6;">Este sitio guarda la información en un servidor compartido (Cloudflare Worker + KV), gratuito para este tamaño de equipo.
      Cualquier persona que abra el link ve y edita los mismos datos, sin pasos manuales.</p>
      <p style="font-size:12.5px; color:var(--grey-text); line-height:1.6;">Si en algún momento el sitio no logra conectarse al servidor, tus cambios se guardan temporalmente
      solo en tu navegador y verás una advertencia amarilla abajo — reintenta cuando tengas conexión.
      Los botones <strong>⬇ Exportar</strong> / <strong>⬆ Importar</strong> siguen ahí como respaldo manual adicional.</p>
    `;
  }

  loadAll();
})();
</script>
</body>
</html>

  function uid(){ return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function money(n){

    return '$' + n.toLocaleString('en-US', {maximumFractionDigits:0}) + ' USD';
  }
  function pct(n){
    if (n === null || n === undefined || isNaN(n)) return 'n/a';
    return (n*100).toFixed(1) + '%';
  }
  function todayISO(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function formatDateDisplay(iso){
    if(!iso) return '—';
    const parts = iso.split('-');
    if(parts.length !== 3) return iso;
    const [y,m,d] = parts;
    return `${d}/${m}/${y}`;
  }
  function daysSince(dateStr){
    if(!dateStr) return null;
    const d = new Date(dateStr + 'T00:00:00');
    const now = new Date();
    now.setHours(0,0,0,0);
    return Math.round((now - d) / 86400000);
  }
  function monthKey(dateStr){
    if(!dateStr) return null;
    const d = new Date(dateStr + 'T00:00:00');
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }
  function quarterKey(dateStr){
    if(!dateStr) return null;
    const d = new Date(dateStr + 'T00:00:00');
    const q = Math.floor(d.getMonth()/3) + 1;
    return 'Q' + q + '-' + d.getFullYear();
  }
  function currentMonthKey(){
    const now = new Date();
    return now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  }
  function currentQuarterKey(){
    const now = new Date();
    const q = Math.floor(now.getMonth()/3) + 1;
    return 'Q' + q + '-' + now.getFullYear();
  }
  function nextQuarterKey(){
    const now = new Date();
    let q = Math.floor(now.getMonth()/3) + 1;
    let y = now.getFullYear();
    q += 1;
    if(q > 4){ q = 1; y += 1; }
    return 'Q' + q + '-' + y;
  }

  async function loadAll(){
    if(!isConfigured){
      try{
        const c = localStorage.getItem(CONFIG_KEY);
        if(c) state.config = JSON.parse(c);
        const d = localStorage.getItem(DEALS_KEY);
        if(d) state.deals = JSON.parse(d);
      }catch(e){}
      render();
      return;
    }
    try{
      const res = await fetch(APP_CONFIG.API_URL, { method: 'GET' });
      if(!res.ok) throw new Error('Respuesta no OK: ' + res.status);
      const data = await res.json();
      state.config = data.config || state.config;
      state.deals = data.deals || [];
      isOnline = true;
    }catch(e){
      console.error('No se pudo cargar del backend, usando copia local en caché', e);
      isOnline = false;
      try{
        const c = localStorage.getItem(CONFIG_KEY);
        if(c) state.config = JSON.parse(c);
        const d = localStorage.getItem(DEALS_KEY);
        if(d) state.deals = JSON.parse(d);
      }catch(err){}
    }
    render();
  }

  async function pushToBackend(){
    if(!isConfigured) return true;
    try{
      const res = await fetch(APP_CONFIG.API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-API-Key': APP_CONFIG.API_KEY },
        body: JSON.stringify({ config: state.config, deals: state.deals })
      });
      if(!res.ok){
        const err = await res.json().catch(()=>({}));
        throw new Error(err.error || ('HTTP ' + res.status));
      }
      isOnline = true;
      return true;
    }catch(e){
      console.error('Error guardando en backend', e);
      isOnline = false;
      alert('No se pudo guardar en el servidor compartido (' + e.message + '). Tus cambios se guardaron solo en este navegador por ahora — vuelve a intentar cuando tengas conexión.');
      return false;
    }
  }

  function exportData(){
    const payload = { exportedAt: new Date().toISOString(), config: state.config, deals: state.deals };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'forecast-tracker-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

      const text = await file.text();
      const payload = JSON.parse(text);
      if(!payload.deals || !payload.config) throw new Error('Formato inválido');
      const mode = confirm(
        'Importar archivo: presiona "Aceptar" para REEMPLAZAR todos los datos actuales con los del archivo.\n' +
        'Presiona "Cancelar" para FUSIONAR (agrega las oportunidades del archivo a las que ya tienes, sin borrar nada).'
      );
      if(mode){
        state.config = payload.config;
        state.deals = payload.deals;
      } else {
        const existingIds = new Set(state.deals.map(d=>d.id));
        payload.deals.forEach(d=>{ if(!existingIds.has(d.id)) state.deals.push(d); });
        payload.config.reps.forEach(r=>{ if(!state.config.reps.includes(r)) state.config.reps.push(r); });
        state.config.quotas = Object.assign({}, payload.config.quotas, state.config.quotas);
      }
      await saveConfig();
      await saveDeals();
      state.activeTab = 'dashboard';
      document.querySelectorAll('.ft-tab').forEach(t=>t.classList.toggle('active', t.dataset.tab==='dashboard'));
      render();
      alert('Datos importados correctamente.');
    }catch(e){
      console.error(e);
      alert('No se pudo leer el archivo. Asegúrate de que sea un backup exportado desde este mismo tracker.');
    }
  }

  document.getElementById('ft-export-btn').addEventListener('click', exportData);
  document.getElementById('ft-import-btn').addEventListener('click', ()=> document.getElementById('ft-import-file').click());
  document.getElementById('ft-import-file').addEventListener('change', (e)=>{
    if(e.target.files[0]) importData(e.target.files[0]);
    e.target.value = '';
  });

  // ---------- Tabs ----------
  document.querySelectorAll('.ft-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.ft-tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      state.activeTab = tab.dataset.tab;
      state.editingId = null;
      state.formActivities = [];
      render();
    });
  });

  // ---------- Computations ----------
  function filterDealsByRep(rep){
    return rep ? state.deals.filter(d=>d.rep===rep) : state.deals.slice();
  }

  function periodSummary(deals, periodKeyFn, periodVal){
    const open = deals.filter(d=>d.resultado==='Abierta' && periodKeyFn(d.fecha)===periodVal);
    const commit = open.filter(d=>d.fcat==='Commit').reduce((s,d)=>s+Number(d.monto||0),0);
    const probable = open.filter(d=>d.fcat==='Probable').reduce((s,d)=>s+Number(d.monto||0),0);
    const topUpside = open.filter(d=>d.fcat==='Top Upside').reduce((s,d)=>s+Number(d.monto||0),0);
    const upside = open.filter(d=>d.fcat==='Upside').reduce((s,d)=>s+Number(d.monto||0),0);
    const ganado = deals.filter(d=>d.resultado==='Ganada' && periodKeyFn(d.fecha)===periodVal).reduce((s,d)=>s+Number(d.monto||0),0);
    return { commit, probable, topUpside, upside, ganado, total: commit+probable };
  }

  function repAllTimeStats(rep){
    const deals = filterDealsByRep(rep);
    const openDeals = deals.filter(d=>d.resultado==='Abierta');
    const stalled = openDeals.filter(d=>{ const ds = daysSince(lastActivityDate(d)); return ds!==null && ds>STALL_DAYS; }).length;
    const overdue = openDeals.filter(d=>hasOverduePendingActivity(d)).length;
    const ganadas = deals.filter(d=>d.resultado==='Ganada').length;
    const cuotaMensual = getCuotaMensualEstimate(rep, currentMonthKey());
    const cuotaTrimestral = getCuotaTrimestral(rep, currentQuarterKey());
    const cuotaAnual = getCuotaAnual(rep);
    return { stalled, overdue, ganadas, cuotaMensual, cuotaTrimestral, cuotaAnual };
  }
  function periodUpside(deals, periodKeyFn, periodVal){
    return deals.filter(d=>d.resultado==='Abierta' && (d.fcat==='Top Upside'||d.fcat==='Upside') && periodKeyFn(d.fecha)===periodVal)
      .reduce((s,d)=>s+Number(d.monto||0),0);
  }
  function periodTotalPipeline(deals, periodKeyFn, periodVal){
    return deals.filter(d=>d.resultado==='Abierta' && periodKeyFn(d.fecha)===periodVal)
      .reduce((s,d)=>s+Number(d.monto||0),0);
  }

  function tipoBreakdown(deals){
    const won = deals.filter(d=>d.resultado==='Ganada');
    const map = {};
    TIPOS.forEach(t=>{ map[t] = {count:0, monto:0}; });
    map['Sin tipo'] = {count:0, monto:0};
    won.forEach(d=>{
      const key = d.tipo && TIPOS.includes(d.tipo) ? d.tipo : 'Sin tipo';
      map[key].count += 1;
      map[key].monto += Number(d.monto||0);
    });
    return map;
  }

  function statusColor(p){
    if(p===null) return {bg:'#EEE', fg:'#888'};
    if(p<0.7) return {bg:'var(--red-bg)', fg:'var(--red)'};
    if(p<1) return {bg:'var(--amber-bg)', fg:'var(--amber)'};
    return {bg:'var(--green-bg)', fg:'var(--green)'};
  }

    } else if(!isOnline){
      footerNote.innerHTML = '⚠️ <strong>Sin conexión con el servidor compartido.</strong> Tus cambios se guardaron solo en este navegador. Revisa tu API_URL/API_KEY o tu conexión, y vuelve a intentar.';

      footerNote.textContent = 'Conectado al servidor compartido — todo lo que se registra aquí lo ven todos los reps que abran este sitio. Los botones Exportar/Importar siguen disponibles como respaldo.';
    }
    if(state.activeTab==='dashboard') renderDashboard();

      </tr></thead><tbody>`;

        html += `<tr>
          <td>${d.rep}</td><td>${d.oportunidad}</td>

  function renderActivitiesUI(){
    const container = document.getElementById('ft-activities-list');
    if(!container) return;
    if(state.formActivities.length===0){
      container.innerHTML = `<div class="ft-note" style="margin-bottom:8px;">Sin actividades registradas todavía.</div>`;

      container.innerHTML = state.formActivities.map((a,i)=>`
        <div class="ft-activity-row" data-idx="${i}">

          <button type="button" class="ft-btn danger tiny ft-act-remove" title="Quitar">✕</button>
        </div>
      `).join('');
      container.querySelectorAll('.ft-activity-row').forEach(row=>{
        const idx = Number(row.dataset.idx);
        row.querySelector('.ft-act-desc').addEventListener('input', (e)=>{ state.formActivities[idx].descripcion = e.target.value; });
        row.querySelector('.ft-act-fecha').addEventListener('change', (e)=>{ state.formActivities[idx].fecha = e.target.value; });
        row.querySelector('.ft-act-check').addEventListener('change', (e)=>{ state.formActivities[idx].completada = e.target.checked; });
        row.querySelector('.ft-act-remove').addEventListener('click', ()=>{ state.formActivities.splice(idx,1); renderActivitiesUI(); });
      });
    }
  }

  function refreshFcatOptions(){
    const etapaSel = document.getElementById('ft-etapa-select');
    const fcatSel = document.getElementById('ft-fcat-select');
    if(!etapaSel || !fcatSel) return;
    const allowed = computeAllowedFcats(etapaSel.value);
    const prev = fcatSel.value;
    fcatSel.innerHTML = allowed.map(f=>`<option value="${f}" ${f===prev?'selected':''}>${f}</option>`).join('');
    if(!allowed.includes(prev)){
      fcatSel.value = allowed[0];
    }
    fcatSel.disabled = allowed.length===1;
  }
  function refreshResultadoField(){
    const etapaSel = document.getElementById('ft-etapa-select');
    const resSel = document.getElementById('ft-resultado-select');
    if(!etapaSel || !resSel) return;
    const forced = computeForcedResultado(etapaSel.value);
    if(forced){
      resSel.value = forced;
      resSel.disabled = true;
    } else {
      resSel.disabled = false;
    }
  }
  function refreshEtapaDependentFields(){
    refreshFcatOptions();
    refreshResultadoField();
  }

  function renderOportunidades(){
    const editing = state.editingId ? state.deals.find(d=>d.id===state.editingId) : null;

    if(editing && state.formActivities.__loadedFor !== editing.id){
      state.formActivities = JSON.parse(JSON.stringify(editing.actividades || []));
      state.formActivities.__loadedFor = editing.id;

    if(!editing && state.formActivities.__loadedFor !== 'new'){
      state.formActivities = [];

    html += `<div class="ft-form-box">

            <select name="fcat" id="ft-fcat-select">${(function(){

          <div class="ft-field"><label>Resultado</label>
            <select name="resultado" id="ft-resultado-select">${RESULTS.map(s=>`<option ${editing&&editing.resultado===s?'selected':''}>${s}</option>`).join('')}</select>
          </div>
        </div>

          <label>MEDDPICC m&iacute;nimo</label>

    </div>`;

    const allQuarters = Array.from(new Set(state.deals.map(d=>quarterKey(d.fecha)).filter(Boolean)))
      .sort((a,b)=>{
        const [qa,ya] = a.split('-'); const [qb,yb] = b.split('-');
        return (Number(ya)-Number(yb)) || (Number(qa.replace('Q',''))-Number(qb.replace('Q','')));
      });

    html += `<div class="ft-filter-row">
      <select id="ft-filter-rep"><option value="">Todos los reps</option>${reps.map(r=>`<option ${state.oppFilters.rep===r?'selected':''}>${r}</option>`).join('')}</select>
      <select id="ft-filter-result"><option value="">Todos los resultados</option>${RESULTS.map(r=>`<option ${state.oppFilters.result===r?'selected':''}>${r}</option>`).join('')}</select>

      <select id="ft-filter-fcat"><option value="">Todas las forecast category</option>${FCATS.map(f=>`<option ${state.oppFilters.fcat===f?'selected':''}>${f}</option>`).join('')}</select>
      <span class="ft-note">${state.deals.length} oportunidad(es) registradas</span>
    </div>`;

    const sortedDeals = state.deals.slice().sort((a,b)=>{
      const dir = state.oppSort.dir === 'asc' ? 1 : -1;
      const va = a.fecha || '', vb = b.fecha || '';
      if(va < vb) return -1*dir;
      if(va > vb) return 1*dir;
      return 0;
    });
    const sortArrow = state.oppSort.dir === 'asc' ? '▲' : '▼';

    html += `<div class="ft-table-wrap"><table class="ft-table" id="ft-deals-table"><thead><tr>
      <th>Rep</th><th>Cliente (Nombre Comercial)</th><th>Oportunidad</th><th>Etapa</th><th>Forecast</th><th>Tipo</th><th>Monto</th>
      <th id="ft-sort-fecha" style="cursor:pointer; user-select:none;" title="Ordenar por fecha de cierre">Cierre ${sortArrow}</th>
      <th>D&iacute;as s/actividad</th><th>Resultado</th><th></th>
    </tr></thead><tbody>
    ${sortedDeals.length===0 ? `<tr><td colspan="11" class="ft-empty">Sin oportunidades registradas todav&iacute;a. Agrega la primera arriba.</td></tr>` :
      sortedDeals.map(d=>{
        const ds = daysSince(lastActivityDate(d));
        const stalled = d.resultado==='Abierta' && ds!==null && ds>STALL_DAYS;
        const overdue = d.resultado==='Abierta' && hasOverduePendingActivity(d);
        return `<tr data-rep="${d.rep}" data-result="${d.resultado}" data-quarter="${quarterKey(d.fecha)||''}" data-fcat="${d.fcat}">
          <td>${d.rep}</td><td>${d.cliente||'—'}</td><td>${d.oportunidad}</td>
          <td>${d.etapa}</td><td>${fcatBadge(d.fcat)}</td><td>${tipoBadge(d.tipo)}</td><td>${money(d.monto)}</td>
          <td>${formatDateDisplay(d.fecha)}</td>
          <td>${ds===null?'—':(stalled?`<span class="badge badge-stalled">${ds} ⚠️</span>`:ds)}${overdue?` <span class="badge badge-overdue">⏰</span>`:''}</td>
          <td>${resultBadge(d.resultado)}</td>
          <td style="white-space:nowrap;">
            <button class="ft-btn secondary tiny" data-edit="${d.id}">Editar</button>
            <button class="ft-btn danger" data-del="${d.id}">Borrar</button>
          </td>
        </tr>`;

    </tbody></table></div>`;

    body.innerHTML = html;

    refreshEtapaDependentFields();
    document.getElementById('ft-etapa-select').addEventListener('change', refreshEtapaDependentFields);
    renderActivitiesUI();
    document.getElementById('ft-add-activity').addEventListener('click', ()=>{
      state.formActivities.push({descripcion:'', fecha:'', completada:false});
      renderActivitiesUI();
    });

    document.getElementById('ft-deal-form').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const cleanActivities = state.formActivities
        .filter(a=>a && (a.descripcion || a.fecha))
        .map(a=>({descripcion:a.descripcion||'', fecha:a.fecha||'', completada: !!a.completada}));
      const deal = {
        id: editing ? editing.id : uid(),
        rep: fd.get('rep'), cliente: fd.get('cliente'), oportunidad: fd.get('oportunidad'),
        etapa: fd.get('etapa'), fcat: document.getElementById('ft-fcat-select').value, tipo: fd.get('tipo'), monto: Number(fd.get('monto')||0),
        fecha: fd.get('fecha'), fechaProximoPaso: fd.get('fechaProximoPaso'),
        resultado: document.getElementById('ft-resultado-select').value,
        rtc: fd.get('rtc'), comentarios: fd.get('comentarios'),
        actividades: cleanActivities,
        eb: e.target.querySelector('[data-field="eb"]').classList.contains('on'),
        champion: e.target.querySelector('[data-field="champion"]').classList.contains('on'),
        pain: e.target.querySelector('[data-field="pain"]').classList.contains('on'),
        presupuesto: e.target.querySelector('[data-field="presupuesto"]').classList.contains('on'),
        competidor: e.target.querySelector('[data-field="competidor"]').classList.contains('on-warn'),
      };
      if(editing){
        const idx = state.deals.findIndex(d=>d.id===editing.id);
        state.deals[idx] = deal;
      } else {
        state.deals.push(deal);
      }
      state.editingId = null;
      state.formActivities = [];
      await saveDeals();
      render();
    });

    document.querySelectorAll('[data-field]').forEach(t=>{

        if(t.dataset.warn){ t.classList.toggle('on-warn'); }
        else { t.classList.toggle('on'); }
      });
    });

    if(editing){

    document.querySelectorAll('[data-edit]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.editingId = btn.dataset.edit; state.formActivities = []; render(); window.scrollTo(0,0); });
    });
    document.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(confirm('¿Borrar esta oportunidad? Esta acción no se puede deshacer.')){
          state.deals = state.deals.filter(d=>d.id!==btn.dataset.del);
          await saveDeals();
          render();
        }
      });
    });

    function applyFilters(){
      const repVal = document.getElementById('ft-filter-rep').value;
      const resVal = document.getElementById('ft-filter-result').value;
      const qVal = document.getElementById('ft-filter-quarter').value;
      const fcatVal = document.getElementById('ft-filter-fcat').value;
      state.oppFilters = { rep: repVal, result: resVal, quarter: qVal, fcat: fcatVal };
      document.querySelectorAll('#ft-deals-table tbody tr[data-rep]').forEach(tr=>{
        const okRep = !repVal || tr.dataset.rep===repVal;
        const okRes = !resVal || tr.dataset.result===resVal;
        const okQ = !qVal || tr.dataset.quarter===qVal;
        const okFcat = !fcatVal || tr.dataset.fcat===fcatVal;
        tr.style.display = (okRep && okRes && okQ && okFcat) ? '' : 'none';
      });
    }
    document.getElementById('ft-filter-rep').addEventListener('change', applyFilters);
    document.getElementById('ft-filter-result').addEventListener('change', applyFilters);
    document.getElementById('ft-filter-quarter').addEventListener('change', applyFilters);
    document.getElementById('ft-filter-fcat').addEventListener('change', applyFilters);
    applyFilters();

    document.getElementById('ft-sort-fecha').addEventListener('click', ()=>{
      state.oppSort.dir = state.oppSort.dir === 'asc' ? 'desc' : 'asc';
      renderOportunidades();
    });

  function renderCuotas(){
    const reps = state.config.reps;
    let html = `<div class="ft-section-title" style="margin-top:0"><span class="bar"></span>Reps y cuotas (USD)</div>`;
    html += `<div class="ft-note" style="margin-bottom:10px;">Captura la cuota anual y la cuota de cada trimestre por separado — no tienen que ser iguales entre sí (útil si hay estacionalidad). El botón "Aplicar 15/30/30/25%" reparte la cuota anual siguiendo esa curva (la que usa el equipo), como punto de partida — luego puedes ajustar cada Q a mano.</div>`;

      <th>Rep</th><th>Cuota anual</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th></th>

    reps.forEach((rep, i)=>{
      const q = state.config.quotas[rep] || {};
      const inputStyle = "border:1px solid var(--grey-line); border-radius:6px; padding:6px 8px; font-size:12.5px; width:110px;";
      html += `<tr>
        <td><input class="ft-rep-name" data-idx="${i}" value="${rep}" style="border:1px solid var(--grey-line); border-radius:6px; padding:6px 8px; font-size:12.5px; width:150px;"></td>

          <button class="ft-btn danger" data-remove-rep="${rep}">Quitar</button>
        </td>
      </tr>`;
    });
    const totAnual = reps.reduce((s,r)=>s+Number((state.config.quotas[r]||{}).anual||0),0);
    const totQ1 = reps.reduce((s,r)=>s+Number((state.config.quotas[r]||{}).q1||0),0);
    const totQ2 = reps.reduce((s,r)=>s+Number((state.config.quotas[r]||{}).q2||0),0);
    const totQ3 = reps.reduce((s,r)=>s+Number((state.config.quotas[r]||{}).q3||0),0);
    const totQ4 = reps.reduce((s,r)=>s+Number((state.config.quotas[r]||{}).q4||0),0);
    html += `<tr style="background:var(--grey-bg); font-weight:600;"><td>Total equipo</td><td>${money(totAnual)}</td><td>${money(totQ1)}</td><td>${money(totQ2)}</td><td>${money(totQ3)}</td><td>${money(totQ4)}</td><td></td></tr>`;
    html += `</tbody></table></div>`;
    html += `<div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
      <button class="ft-btn secondary" id="ft-add-rep">+ Agregar rep</button>
      <button class="ft-btn" id="ft-save-cuotas">Guardar cambios</button>
      <button class="ft-btn secondary" id="ft-seed-data" style="border-color:var(--amber); color:var(--amber);">🔄 Cargar datos de ejemplo (SEIDOR)</button>

    html += `<div class="ft-note">Los nombres de rep deben coincidir exactamente con los que uses en "Oportunidades" para que el Dashboard sume correctamente.</div>`;
    html += `<div class="ft-note">"Cargar datos de ejemplo" reemplaza reps y oportunidades actuales por las 155 oportunidades cargadas desde tu export de HubSpot (53 ya ganadas + 102 en pipeline abierto), de los 8 reps que aparecen en el export. Úsalo solo si quieres reiniciar con esos datos — es una acción destructiva.</div>`;

    body.innerHTML = html;

    document.querySelectorAll('[data-split-rep]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const rep = btn.dataset.splitRep;
        const anualInput = document.querySelector(`.ft-quota-anual[data-rep="${rep}"]`);
        const anual = Number(anualInput.value||0);
        document.querySelector(`.ft-quota-q1[data-rep="${rep}"]`).value = Math.round(anual*0.15);
        document.querySelector(`.ft-quota-q2[data-rep="${rep}"]`).value = Math.round(anual*0.30);
        document.querySelector(`.ft-quota-q3[data-rep="${rep}"]`).value = Math.round(anual*0.30);
        document.querySelector(`.ft-quota-q4[data-rep="${rep}"]`).value = Math.round(anual*0.25);
      });

    document.getElementById('ft-add-rep').addEventListener('click', async ()=>{
      let n = 1;
      let name = 'Nuevo Rep';
      while(state.config.reps.includes(name)){ n++; name = 'Nuevo Rep ' + n; }
      state.config.reps.push(name);
      state.config.quotas[name] = {anual:0, q1:0, q2:0, q3:0, q4:0};
      await saveConfig();
      render();
    });

    document.querySelectorAll('[data-remove-rep]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const rep = btn.dataset.removeRep;
        const hasDeals = state.deals.some(d=>d.rep===rep);
        if(hasDeals && !confirm(`${rep} tiene oportunidades registradas. ¿Quitarlo de la lista de reps de todos modos? Sus oportunidades no se borrarán pero dejarán de sumar en el Dashboard.`)) return;
        state.config.reps = state.config.reps.filter(r=>r!==rep);
        delete state.config.quotas[rep];
        await saveConfig();
        render();
      });
    });

    document.getElementById('ft-save-cuotas').addEventListener('click', async ()=>{
      const newReps = [];
      document.querySelectorAll('.ft-rep-name').forEach(input=>{
        newReps.push(input.value.trim() || ('Rep ' + (Number(input.dataset.idx)+1)));
      });
      const oldReps = state.config.reps;
      const newQuotas = {};
      const fields = [['ft-quota-anual','anual'],['ft-quota-q1','q1'],['ft-quota-q2','q2'],['ft-quota-q3','q3'],['ft-quota-q4','q4']];
      fields.forEach(([cls, key])=>{
        document.querySelectorAll('.'+cls).forEach((input, i)=>{
          const rep = newReps[i];
          newQuotas[rep] = newQuotas[rep] || {};
          newQuotas[rep][key] = Number(input.value||0);
        });
      });
      oldReps.forEach((oldRep, i)=>{
        const newRep = newReps[i];
        if(newRep && newRep !== oldRep){
          state.deals.forEach(d=>{ if(d.rep===oldRep) d.rep = newRep; });
        }
      });
      state.config.reps = newReps;
      state.config.quotas = newQuotas;
      await saveConfig();
      await saveDeals();
      render();
    });

      state.config = { reps: SEED_DATA.reps.slice(), quotas: JSON.parse(JSON.stringify(SEED_DATA.quotas)) };
      state.deals = JSON.parse(JSON.stringify(SEED_DATA.deals));
      await saveConfig();
      await saveDeals();
      state.dashboardScope = '__team__';
      state.activeTab = 'dashboard';
      document.querySelectorAll('.ft-tab').forEach(t=>t.classList.toggle('active', t.dataset.tab==='dashboard'));
      render();
    });
  }

  function renderAyuda(){

      • Si la etapa es <strong>C - Negotiation</strong>, solo se puede elegir <strong>Commit</strong> o <strong>Probable</strong>.<br>

  loadAll();
